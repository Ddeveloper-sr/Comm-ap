<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication — Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>Communication</h1>
    <p class="subtitle">Sign in or create an account</p>

    <div class="auth-tabs">
      <button id="tab-login" class="tab-btn active">Log In</button>
      <button id="tab-signup" class="tab-btn">Sign Up</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>

    <form id="signup-form" class="auth-form hidden">
      <input type="text" id="signup-username" placeholder="Username" required>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password (min 6 chars)" required>
      <button type="submit">Sign Up</button>
    </form>

    <p id="auth-error" class="error-text"></p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
